# Despliegue en un VPS:  docker compose up -d --build
# Antes: copia deploy/docker.env.example a ".env" (en esta misma carpeta) y complétalo.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?define DB_ADMIN_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-refurbiz}
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_APP_USER: refurbiz_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?define DB_APP_PASSWORD en .env}
    # Sin dominio/HTTPS: expone el puerto 3000 directamente. Con Caddy (abajo) deja solo "expose".
    ports:
      - "${APP_PORT:-3000}:3000"

  # HTTPS automatico con dominio propio: activa con  docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}

volumes:
  pgdata:
  caddy_data:
